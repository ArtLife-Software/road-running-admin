<html lang="zh-TW">

<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3349;--accent:#f97316;--accent2:#fb923c;--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--muted:#9aa1b5;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:20px;padding-bottom:90px;}
.header{text-align:center;padding:24px 0 16px;}
.header .logo{font-size:2rem;margin-bottom:4px;}
.header .title{font-size:1.2rem;font-weight:900;}
.header .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;gap:4px;}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.tab.active{background:var(--accent);color:#fff;}
.page{display:none;}
.page.active{display:block;}
.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:.92rem;outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--accent);}
.input-group{margin-bottom:14px;}
.input-group label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.required-star{color:var(--red);text-transform:none;}
.input-row{display:flex;gap:8px;align-items:flex-start;}
.input-row .input{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:8px;border:none;font-family:var(--sans);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:6px;}
.btn-full{width:100%;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.csv-hint{font-size:.78rem;color:var(--muted);margin-bottom:16px;padding:10px 12px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);line-height:1.6;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.badge-green{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.3);}
.runner-card-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:.95rem;}
.station-stats{display:flex;flex-direction:column;gap:8px;}
.station-num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-top:10px;}
.table-wrap table{width:max-content;min-width:100%;border-collapse:collapse;}
.table-wrap th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;}
.table-wrap td{padding:8px 12px;border-top:1px solid var(--border);font-size:.82rem;font-family:var(--mono);white-space:nowrap;}
.table-wrap td:first-child,.table-wrap th:first-child{font-family:var(--sans);white-space:normal;}
.loading-cell{text-align:center;color:var(--muted);padding:30px 10px;font-size:.85rem;}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;background:#fff;border-radius:12px;margin-top:12px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:.88rem;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:all .25s;z-index:9999;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;}
/* ── 關於 Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:500;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.about-title{font-size:1.1rem;font-weight:900;color:var(--accent);margin-bottom:16px;}
.about-row{display:flex;align-items:flex-start;padding:3px 0;font-size:.85rem;}
.about-row .about-label{width:80px;flex-shrink:0;color:var(--muted);}
.about-row .about-value{flex:1;color:var(--text);word-break:break-all;}
.about-row .about-value a{color:var(--accent);text-decoration:underline;}
.about-divider{height:1px;background:var(--border);margin:14px 0;}
/* ── 完賽證書 ── */
.cert-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:600;padding:16px;overflow:auto;}
.cert-modal-box{background:#12141c;border-radius:16px;padding:16px;max-width:96vw;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.cert-scale-wrap{width:100%;overflow:auto;display:flex;justify-content:center;}
#certCanvas{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:6px;}
.cert-loading{color:#c9cede;padding:60px 40px;text-align:center;font-size:.9rem;min-width:260px;}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
@media print{
  body *{visibility:hidden;}
  .cert-modal-overlay, .cert-modal-overlay *{visibility:visible;}
  .cert-modal-overlay{position:fixed;inset:0;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;}
  .cert-modal-box{box-shadow:none;background:#fff;padding:0;}
  .cert-scale-wrap{overflow:visible;}
  .cert-no-print{display:none!important;}
  #certCanvas{max-width:100vw;max-height:100vh;border-radius:0;}
  /* 紙張方向依證書是橫式或直式，列印前由 printCertificate() 動態設定 */
}
</style>

<div class="wrap">

  <div class="tabs">
    <div class="tab active" data-page="signup" onclick="showPage('signup')">📝 報名</div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

    <a href="admin.html?mode=stats" target="_blank" style="font-size:.78rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">📊 即時統計 →</a>

  <!-- ════════ 查詢成績 ════════ -->
  <div id="page-lookup" class="page">
    <div class="card">
      <div class="csv-hint">ID 和身分證字號填寫其中一項即可，兩項都填寫時，符合任一項即可查詢。</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px">
        <div class="input-group" style="margin:0"><label>ID</label><input id="lookupId" type="text" class="input" placeholder="R0001" oninput="applyHalf(this)"></div>
        <div class="input-group" style="margin:0"><label>身分證字號</label><input id="lookupIdNum" type="text" class="input" placeholder="A123456789" oninput="applyHalf(this)"></div>
      </div>
      <div class="input-group"><label>生日（yyyy/mm/dd）<span class="required-star">*</span></label><div class="input-row"><input id="lookupBirthday" data-fmt="ymd" type="text" class="input" placeholder="1990/01/01" oninput="applyHalf(this)"><button type="button" class="btn btn-ghost btn-sm" onclick="var _d=document.getElementById('lookupBirthdayPicker');_d.showPicker?_d.showPicker():_d.click()">📅</button><input type="date" id="lookupBirthdayPicker" style="display:none" onchange="if(this.value){const[y,m,d]=this.value.split('-');document.getElementById('lookupBirthday').value=y+'/'+m+'/'+d;this.value=''}"></div></div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div class="input-group" id="lookupEventRow" style="margin:0;flex:1;min-width:160px"><label>選擇賽事</label><select id="lookupEventSelect" class="input"><option value="">請選擇賽事...</option></select></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;white-space:nowrap;margin-top:18px">
          <input type="checkbox" id="lookupAllEvents" onchange="onLookupAllEventsChange()">
          歷次賽事
        </label>
      </div>
      <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="doLookup()">🔍 查詢成績</button>
    </div>
    <div id="lookupResult"></div>

</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, query, orderBy, where, serverTimestamp, writeBatch, deleteField, runTransaction, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWn7703qi0X6rL2c4WBhieTZ2-_JSrvco",
  authDomain: "road-running-check-in-system.firebaseapp.com",
  projectId: "road-running-check-in-system",
  storageBucket: "road-running-check-in-system.firebasestorage.app",
  messagingSenderId: "19800079371",
  appId: "1:19800079371:web:157af22aa9f1533387db0e"
};
const app = initializeApp(firebaseConfig);
// App Check：確保呼叫Cloud Function的請求真的是從這個網頁發出的，擋掉繞過網頁畫面、
// 直接寫程式呼叫API的機器人。網站金鑰已換成 Firebase Console→App Check→
// 註冊應用程式(reCAPTCHA v3提供者)拿到的真實金鑰。
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider('6LeH82QtAAAAANl6-GvxdulgCoaBj1GoyKtfqSTR'),
  isTokenAutoRefreshEnabled: true
});
const db = getFirestore(app);
const auth = getAuth(app);
// Cloud Functions（報名交易處理部署在 asia-east1 台灣區域）
const functions = getFunctions(app, 'asia-east1');

// ── 匿名登入（使用者無感）──
// firestore.rules 現在要求所有讀寫至少要有登入身分，這裡在背景自動
// 取得匿名身分，選手不需要註冊任何帳號。登入狀態會存在瀏覽器裡，
// 之後重新開啟頁面會直接沿用，不會每次都建立新帳號。
//
// ⚠️ 這裡故意不用「if(auth.currentUser) return; 否則 signInAnonymously()」
// 這種寫法：頁面剛載入時，Firebase 都還在背景非同步地從瀏覽器裡還原「先前
// 已經登入」的身分（例如同一瀏覽器另一分頁開著 admin.html 用管理員帳號
// 登入），這個還原動作還沒完成之前 auth.currentUser 會短暫是 null。
// 若直接判斷 null 就呼叫 signInAnonymously()，等於在管理員身分「正要」
// 被還原的那一瞬間硬塞進一個匿名身分，蓋掉同瀏覽器（同網域）其他分頁
// 原本的管理員登入狀態，導致 admin.html 被強制登出。
// 改用 onAuthStateChanged 等 Firebase 確定「目前到底有沒有人登入」之後，
// 沒有才補做匿名登入；已經有登入（不論是管理員或匿名）就直接沿用。
let ensureAuthPromise = null;
function ensureAuth(){
  if (!ensureAuthPromise) {
    ensureAuthPromise = new Promise((resolve, reject) => {
      const unsub = onAuthStateChanged(auth, async user => {
        unsub();
        if (user) { resolve(); return; }
        try { await signInAnonymously(auth); resolve(); }
        catch(e){ showToast('連線初始化失敗，請重新整理頁面：'+e.message,'error'); reject(e); }
      });
    });
  }
  return ensureAuthPromise;
}

// ── 邀請碼雜湊 ──
// 邀請碼在資料庫裡只存 SHA-256 雜湊（inviteCodeHash），不存明文——
// 組別文件是公開可讀的，存明文等於把邀請碼直接送給所有人。
// 驗證時把使用者輸入做同樣的雜湊再比對。
async function sha256Hex(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// 檢查這個組別是否設有邀請碼（新版存雜湊；相容還沒重新儲存過的舊資料明文）
function groupHasInvite(g){
  return !!(g&&((g.inviteCodeHash&&g.inviteCodeHash.trim())||(g.inviteCode&&g.inviteCode.trim())));
}
// 驗證邀請碼是否正確（優先比對雜湊，退回舊版明文）
async function checkInviteCode(g,input){
  const v=(input||'').trim();
  if(g.inviteCodeHash&&g.inviteCodeHash.trim()){
    return (await sha256Hex(v))===g.inviteCodeHash.trim();
  }
  return v===(g.inviteCode||'').trim();
}
// ── 報名限制（性別、年齡、家長陪同、邀請碼）：賽事或組別「二選一」，不合併（跟 admin.html、後端一致）──
// 組別勾了「此組別自訂報名限制」→ 只用組別的；沒勾 → 只用賽事的。舊資料沒有 limitOverride：組別有設任何限制就當作自訂。
// 組別名額、賽事總名額另外計算，一直有效。
const LIMIT_KEYS=['genderLimit','ageMin','ageMax','parentalAge'];
function groupLimitOverride(g){
  if(!g) return false;
  if(typeof g.limitOverride==='boolean') return g.limitOverride;
  return LIMIT_KEYS.some(k=>g[k])||groupHasInvite(g);
}
function limitSource(ev,g){ return groupLimitOverride(g)?{o:g,who:'此組別'}:{o:ev||{},who:'此賽事'}; }
function effParentalAge(ev,g){ return limitSource(ev,g).o.parentalAge||0; }
function inviteTarget(ev,g){ const o=limitSource(ev,g).o; return groupHasInvite(o)?o:null; }
function regLimitError(ev,g,gender,birthday,evDate){
  const {o,who}=limitSource(ev,g);
  if(o.genderLimit&&gender&&o.genderLimit!==gender) return who+'限'+o.genderLimit+'性報名';
  if(birthday&&evDate){
    const age=calcAgeRunner(birthday,evDate);
    if(age!==null){
      if(o.ageMin>0&&age<o.ageMin) return who+'年齡限制 '+o.ageMin+' 歲以上（您的年齡：'+age+'歲）';
      if(o.ageMax>0&&age>o.ageMax) return who+'年齡限制 '+o.ageMax+' 歲以下（您的年齡：'+age+'歲）';
    }
  }
  return '';
}
function limitHintList(o){
  const h=[]; o=o||{};
  if(o.genderLimit)h.push('限'+o.genderLimit+'性');
  if(o.ageMin>0)h.push(o.ageMin+'歲以上');
  if(o.ageMax>0)h.push(o.ageMax+'歲以下');
  if(o.parentalAge>0)h.push(o.parentalAge+'歲以下須家長陪同聲明');
  if(groupHasInvite(o))h.push('需要邀請碼');
  return h;
}
// 組別說明裡的「此組別限制」：自訂報名限制的組別列出它自己的限制；組別名額一律列出
// 選到的組別適用的限制：組別自訂就是組別的，沒自訂就是賽事的；再加上組別名額（邀請碼另有欄位，不列）
function limitHintsFor(ev,g){
  const own=!!g&&groupLimitOverride(g);
  const h=limitHintList(own?g:(ev||{})).filter(x=>x!=='需要邀請碼');
  if(g&&g.groupCapacity>0) h.push('限'+g.groupCapacity+'人');
  return h;
}
function groupLimitHints(g){
  const h=groupLimitOverride(g)?limitHintList(g).filter(x=>x!=='需要邀請碼'):[];
  if(g&&g.groupCapacity>0) h.push('限'+g.groupCapacity+'人');
  return h;
}


// ── HTML escape（防止使用者輸入被當作HTML/JS執行）──
function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// 組別排序：有 sortOrder 就依它排（管理員在後台手動排序過的結果），沒有的組別維持查詢回傳的原始順序
// （createdAt asc），不會因為缺欄位而消失或被排到奇怪的位置。跟 admin.html 共用同一套邏輯。
function sortGroupDocs(docs){
  return docs.slice().sort((a,b)=>{
    const ao=a.data().sortOrder, bo=b.data().sortOrder;
    if(typeof ao==='number'&&typeof bo==='number')return ao-bo;
    if(typeof ao==='number')return -1;
    if(typeof bo==='number')return 1;
    return 0;
  });
}
function escJs(v) {
  return String(v ?? '')
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 工具函式 ──
function fmt(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('zh-TW', {hour12:false});
}
function diffHMS(a, b) {
  if (!a || !b) return '-';
  const da = a.toDate ? a.toDate() : new Date(a);
  const db2 = b.toDate ? b.toDate() : new Date(b);
  const s = Math.max(0, Math.floor((da - db2) / 1000));
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function toHalf(str) {
  if (!str) return str;
  return str.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
            .replace(/　/g, ' ');
}
function applyHalf(el) {
  const v = toHalf(el.value);
  if (v !== el.value) { el.value = v; el.dispatchEvent(new Event('input')); }
}
window.toHalf = toHalf;
window.applyHalf = applyHalf;

function autoSlashDate(el) {
  const isDelete = el._lastLen !== undefined && el.value.length < el._lastLen;
  el._lastLen = el.value.length;
  if (isDelete) return;
  const pos = el.selectionStart;
  const raw = el.value;
  const digits = raw.replace(/\D/g, '').slice(0, 8);
  let out = digits;
  if (digits.length > 4) out = digits.slice(0,4) + '/' + digits.slice(4);
  if (digits.length > 6) out = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6);
  if (out !== raw) {
    const slashesBeforeInRaw = (raw.slice(0, pos).match(/\//g) || []).length;
    const slashesBeforeInOut = (out.slice(0, pos).match(/\//g) || []).length;
    const newPos = Math.min(pos + (slashesBeforeInOut - slashesBeforeInRaw), out.length);
    el.value = out;
    el._lastLen = out.length;
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  }
}
window.autoSlashDate = autoSlashDate;

// ── 全形→半形：統一監聽所有 input ──
document.addEventListener('input', function(e) {
  const el = e.target;
  const tag = el.tagName;
  const type = (el.type||'').toLowerCase();
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;
  if (['checkbox','radio','file','date','datetime-local','time','color','range'].includes(type)) return;
  const v = toHalf(el.value);
  if (v !== el.value) {
    const pos = el.selectionStart;
    el.value = v;
    try { el.setSelectionRange(pos, pos); } catch(e) {}
  }
  if (el.dataset.fmt === 'ymd') autoSlashDate(el);
}, true);

function validateBirthday(v) {
  if (!v) return true; // 空值由呼叫端決定是否必填
  if (!/^\d{4}\/\d{2}\/\d{2}$/.test(v)) return false;
  const [y,m,d] = v.split('/').map(Number);
  const dt = new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return false;
  if(y<1900) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  if(dt>=today) return false; // 不能是今天或未來
  return true;
}
window.validateBirthday=validateBirthday;
function validatePhone(v) { if (!v) return true; return /^09\d{8}$/.test(v); }
function validateEmail(v) {
  if (!v) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}
function validateId(v) {
  if (!v) return true;
  return /^[A-Za-z]\d{9}$/.test(v);
}

// qrcodejs 對多位元組(中文)字元處理有bug，需先轉換為UTF-8位元組序列
function utf16to8(str){
  let out='';
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if(c>=0x0001&&c<=0x007F){
      out+=str.charAt(i);
    }else if(c>0x07FF){
      out+=String.fromCharCode(0xE0|((c>>12)&0x0F));
      out+=String.fromCharCode(0x80|((c>>6)&0x3F));
      out+=String.fromCharCode(0x80|((c>>0)&0x3F));
    }else{
      out+=String.fromCharCode(0xC0|((c>>6)&0x1F));
      out+=String.fromCharCode(0x80|((c>>0)&0x3F));
    }
  }
  return out;
}
function makeQRCode(el,text,size){
  el.innerHTML='';
  new QRCode(el,{text:utf16to8(text),width:size,height:size});
}

// 判斷選手報名是否開放（OR 邏輯：任一條件符合即開放）
function isRunnerRegOpen(ev, entryCount) {
  const now = Date.now();
  // 條件1：手動開關 ON → 一律可報名
  if (ev.registrationOpen) return true;
  // 未手動開放：須同時符合「時間範圍內」且「人數未滿」才能報名
  // 時間範圍：開始、結束都沒設定＝不開放；只設其中一個時，另一邊不限制
  const start = ev.registrationStartAt?.toDate?.()?.getTime() ?? null;
  const end   = ev.registrationEndAt?.toDate?.()?.getTime() ?? null;
  if (start === null && end === null) return false; // 沒有設定報名期間＝不開放
  const afterStart = (start === null || now >= start);
  const beforeEnd  = (end   === null || now <= end);
  const inTimeRange = afterStart && beforeEnd;
  // 人數上限：0 或未設定視為不限制（通過）
  const cap = ev.registrationCapacity ?? 0;
  const underCapacity = (cap === 0 || entryCount < cap);
  return inTimeRange && underCapacity;
}

// 產生報名資訊說明文字（顯示在賽事資訊卡）
function buildRegInfoHtml(ev, entryCount) {
  const fmtDT = ts => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  };
  const lines = [];
  if (ev.registrationStartAt) lines.push('報名開始：' + fmtDT(ev.registrationStartAt));
  if (ev.registrationEndAt)   lines.push('報名截止：' + fmtDT(ev.registrationEndAt));
  const cap = ev.registrationCapacity ?? 0;
  const showCapacity = ev.showCapacity !== false;
  const mode = ev.entryCountDisplay || 'threshold';
  const threshold = ev.entryCountThreshold ?? 0;
  let showCount;
  if (mode === 'hidden') showCount = false;
  else if (mode === 'capOnly') showCount = cap > 0;
  else showCount = entryCount >= threshold; // 'threshold'：0＝一律顯示
  if (showCount) lines.push('已報名人數：' + entryCount);
  if (showCapacity && cap > 0) lines.push('報名總人數上限：' + cap);
  return lines.length ? lines.map(l=>'<div style="font-size:.75rem;color:var(--muted);margin-top:3px">'+l+'</div>').join('') : '';
}

async function initSignupPage(){
  signupEvents=[];
  const content=document.getElementById('signupContent');
  content.innerHTML='<div class="card"><div class="loading-cell">載入中...</div></div>';
  // 取得所有賽事，由前端做開放判斷
  const snap=await getDocs(query(collection(db,'events'), orderBy('createdAt','desc')));
  const openEvents=[];
  for(const d of snap.docs){
    const ev={id:d.id,...d.data()};
    // 取目前報名人數：用聚合計數查詢，只回傳數字、不下載整個報名集合
    const countSnap=await getCountFromServer(collection(db,'events',d.id,'runners'));
    ev._entryCount = countSnap.data().count;
    if(isRunnerRegOpen(ev, ev._entryCount)) openEvents.push(ev);
  }
  signupEvents=openEvents;
  if(!signupEvents.length){
    content.innerHTML='<div class="card"><div class="loading-cell">目前沒有開放報名的賽事</div></div>';
    return;
  }
  if(signupEvents.length===1){
    await selectSignupEvent(signupEvents[0].id);
  } else {
    let html='<div class="card"><div class="input-group"><label>選擇賽事</label><select id="signupEventSelect" class="input" onchange="onSignupEventSelect()">';
    html+='<option value="">請選擇...</option>';
    signupEvents.forEach(ev=>{
      const selected=(lastSignupEventId&&ev.id===lastSignupEventId)?' selected':'';
      html+='<option value="'+ev.id+'"'+selected+'>'+esc(ev.name)+(ev.date?'（'+esc(ev.date)+'）':'')+'</option>';
    });
    html+='</select></div></div><div id="signupForm"></div>';
    content.innerHTML=html;
    if(lastSignupEventId&&signupEvents.find(e=>e.id===lastSignupEventId)){
      await selectSignupEvent(lastSignupEventId, true);
    }
  }
}
window.onSignupEventSelect=async function(){
  const id=document.getElementById('signupEventSelect').value;

  await selectSignupEvent(id, true);
}

  formHtml+='<option value="">'+(groupDocs.length?'請選擇...':'（此賽事尚未設定組別）')+'</option>';

// 顯示/隱藏、標籤上的範圍提示、輸入框 placeholder。組別切換時呼叫一次。
function refreshSignupBibField(g){
  const row=document.getElementById('suBibRow');
  if(!row)return;
  const {pad,allowCustomBib,min,max,note}=getEffBibSettings(g);
  if(!allowCustomBib){row.style.display='none';return;}
  row.style.display='';
  const noteEl=document.getElementById('suBibNote');
  if(noteEl)noteEl.textContent=note;
  const label=document.getElementById('suBibLabel');
  if(label)label.textContent='選手號碼（選填，號碼須在 '+min+'～'+max+' 之間，留空系統自動配號）';
  const el=document.getElementById('suBib');
  if(el)el.placeholder='例：'+String(min).padStart(pad,'0')+'～'+String(max).padStart(pad,'0');
  // 換組別代表範圍可能變了，先清掉「號碼是否用完」的快取檢查旗標，讓下次focus重新檢查一次
  if(el){el.dataset.exhaustChecked='';}
  const hint=document.getElementById('suBibHint');
  if(hint)hint.textContent='';
  const panel=document.getElementById('suBibAvailPanel');
  if(panel)panel.style.display='none';
}

// ── 複選欄位（自訂欄位 type:'multi'）──
// 值存成字串陣列；勾「其他」時把輸入的文字也放進陣列。
// 必填＝至少選一項；最少（minSel）、最多（maxSel）留空＝不限。選填時可以都不選，有選就要符合最少／最多。
function multiRangeText(f){
  const mn=f.minSel||0, mx=f.maxSel||0;
  if(mn&&mx) return mn===mx?'請選 '+mn+' 項':'請選 '+mn+'～'+mx+' 項';
  if(mn) return '至少選 '+mn+' 項';
  if(mx) return '最多選 '+mx+' 項';
  return '可複選';
}
function multiFieldHtml(id, f, cur, reqMark, descHtml){
  cur=Array.isArray(cur)?cur:(cur?[String(cur)]:[]);
  const opts=f.options||[];
  const others=cur.filter(v=>!opts.includes(v));
  let h='<div class="input-group"><label>'+esc(f.label)+reqMark+' <span style="font-weight:400;color:var(--muted);font-size:.75rem">（'+multiRangeText(f)+'）</span></label>'
    +'<div id="'+id+'" class="cf-multi" style="display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0">';
  opts.forEach(o=>{ h+='<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem"><input type="checkbox" value="'+esc(o)+'"'+(cur.includes(o)?' checked':'')+'> '+esc(o)+'</label>'; });
  if(f.allowOther) h+='<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem"><input type="checkbox" data-other="1"'+(others.length?' checked':'')
    +' onchange="document.getElementById(\''+id+'_other\').style.display=this.checked?\'block\':\'none\'"> 其他（請輸入）</label>';
  h+='</div>';
  if(f.allowOther) h+='<input type="text" id="'+id+'_other" class="input" style="margin-top:6px;display:'+(others.length?'block':'none')+'" placeholder="請輸入..." value="'+esc(others.join('、'))+'">';
  return h+descHtml+'</div>';
}
function multiCheck(f, vals){
  const n=vals.length;
  if(f.required&&!n) return '「'+f.label+'」為必填，請至少選一項';
  if(n){
    if(f.minSel&&n<f.minSel) return '「'+f.label+'」至少要選 '+f.minSel+' 項';
    if(f.maxSel&&n>f.maxSel) return '「'+f.label+'」最多只能選 '+f.maxSel+' 項';
  }
  return '';
}
// 讀出複選欄位的值：回傳 {value:[...]} 或 {error:'訊息'}
function readMultiField(id, f){
  const box=document.getElementById(id); if(!box) return {value:[]};
  const vals=[...box.querySelectorAll('input[type=checkbox]:not([data-other]):checked')].map(el=>el.value);
  const oc=box.querySelector('input[data-other]');
  if(oc&&oc.checked){
    const t=(document.getElementById(id+'_other')?.value||'').trim();
    if(!t) return {error:'「'+f.label+'」勾選了「其他」，請輸入內容'};
    vals.push(t);
  }
  const err=multiCheck(f, vals);
  return err?{error:err}:{value:vals};
}
// 自訂欄位的顯示文字（列表、匯出用）
function cfDisplayValue(f, v){
  if(f.type==='checkbox') return v?'是':'否';
  if(Array.isArray(v)) return v.join('、');
  return v===undefined||v===null?'':String(v);
}

// ── 自訂欄位的顯示條件與區塊（admin.html／runner.html／staff.html／後端各放一份，判斷邏輯必須一致）──
// 欄位可設 cond：{ src, op, val }
//   src：排在上面的某個自訂欄位 id，或 '__gender'（性別）、'__age'（年齡，以賽事日期計算）
//   op：in（等於其中任一項：下拉、性別）、has（有勾其中任一項：複選）、checked／unchecked（勾選框）、
//       filled／empty（文字有填／沒填）、age（年齡介於 val.min～val.max，留空不限）
// 區塊標題（type:'section'）：到下一個區塊標題前的欄位都屬於它；區塊隱藏時，裡面的欄位全部隱藏。
// 隱藏的欄位不顯示、不驗證、不送出（跟「適用組別」一樣）；條件來源被隱藏時，依賴它的欄位也隱藏。
// ctx：{ groupId, gender, age }；values：{ 欄位id: 目前的值 }
// 單一條件是否成立。srcVisible：來源欄位是否顯示中；v：來源欄位的值
function cfCondMatch(c, ctx, srcVisible, v){
  if(!c||!c.src) return true;
  if(c.src==='__gender') return (c.val||[]).includes(ctx.gender||'');
  if(c.src==='__age'){
    const a=ctx.age; if(a===null||a===undefined||isNaN(a)) return false;
    const mn=c.val&&c.val.min, mx=c.val&&c.val.max;
    return (!(mn>0)||a>=mn)&&(!(mx>0)||a<=mx);
  }
  if(!srcVisible) return false; // 來源被隱藏、排在下面或已刪除
  switch(c.op){
    case 'in': return typeof v==='string'&&(c.val||[]).includes(v);
    case 'has': return Array.isArray(v)&&v.some(x=>(c.val||[]).includes(x));
    case 'checked': return v===true;
    case 'unchecked': return v!==true;
    case 'filled': return Array.isArray(v)?v.length>0:(typeof v==='string'?!!v.trim():!!v);
    case 'empty': return !(Array.isArray(v)?v.length>0:(typeof v==='string'?!!v.trim():!!v));
    default: return true;
  }
}
function cfGroupOk(f, ctx){ return !f.groups||!f.groups.length||f.groups.includes(ctx.groupId||''); }
function cfVisibility(fields, values, ctx){
  const vis={}; let sec=true;
  for(const f of fields){
    const ok=cfGroupOk(f,ctx)&&cfCondMatch(f.cond,ctx,f.cond&&vis[f.cond.src],f.cond&&values[f.cond.src]);
    if(f.type==='section'){ sec=ok; vis[f.id]=sec; continue; }
    vis[f.id]=sec&&ok;
  }
  return vis;
}
// 表單、列表、匯出用的「有資料的欄位」（排除區塊標題）
function cfDataFields(fields){ return (fields||[]).filter(f=>f.type!=='section'); }
// 讀出表單上某個自訂欄位目前的值（判斷顯示條件用）
function cfReadRaw(id, f){
  const el=document.getElementById(id); if(!el) return undefined;
  if(f.type==='multi'){
    const vals=[...el.querySelectorAll('input[type=checkbox]:not([data-other]):checked')].map(x=>x.value);
    const oc=el.querySelector('input[data-other]');
    if(oc&&oc.checked){ const t=(document.getElementById(id+'_other')?.value||'').trim(); if(t) vals.push(t); }
    return vals;
  }
  if(f.type==='checkbox') return el.checked;
  let v=(el.value||'').trim();
  if(f.type==='select'&&f.allowOther&&v==='__other__') v=(document.getElementById(id+'_other')?.value||'').trim();
  return v;
}
// 依目前填寫內容切換欄位的顯示；回傳 vis（欄位id → 是否顯示）
function cfApplyVisibility(fields, idPrefix, rowPrefix, ctx){
  const values={};
  (fields||[]).forEach(f=>{ if(f.type!=='section') values[f.id]=cfReadRaw(idPrefix+f.id,f); });
  const vis=cfVisibility(fields||[], values, ctx);
  (fields||[]).forEach(f=>{ const row=document.getElementById(rowPrefix+f.id); if(row) row.style.display=vis[f.id]?'':'none'; });
  return vis;
}
// 表單上的年齡（以賽事日期計算；生日沒填或格式不對＝null）
function cfAgeFrom(birthday, evDate){
  if(!birthday||!/^\d{4}\/\d{2}\/\d{2}$/.test(birthday)) return null;
  const [by,bm,bd]=birthday.split('/').map(Number);
  const base=evDate?new Date(String(evDate).replace(/\//g,'-')+'T00:00:00'):new Date();
  if(isNaN(base)) return null;
  let age=base.getFullYear()-by;
  if(base.getMonth()+1<bm||(base.getMonth()+1===bm&&base.getDate()<bd)) age--;
  return age>=0?age:null;
}
function cfSectionHtml(f){
  return '<div class="cf-section" style="margin:18px 0 12px;padding-top:12px;border-top:1px solid var(--border)">'
    +'<div style="font-weight:800;font-size:.95rem">'+esc(f.label)+'</div>'
    +(f.description?'<div style="font-size:.78rem;color:var(--muted);margin-top:2px">'+esc(f.description)+'</div>':'')+'</div>';
}

// 報名表單：依組別、性別、年齡與已填內容切換自訂欄位（顯示條件、區塊、適用組別）

// 任何輸入變動都重新判斷顯示條件（報名表單、各張修改表單）

// ── 組別切換時動態顯示限制欄位 ──
window.onSignupGroupChange=function(){
  const group=document.getElementById('suGroup')?.value;
  const g=window._signupGroupMap?.[group];
  const inviteRow=document.getElementById('suInviteCodeRow');
  const parentalBlock=document.getElementById('suParentalBlock');
  const hint=document.getElementById('suGroupHint');
  const noteEl=document.getElementById('suGroupNote');
  if(noteEl)noteEl.textContent=g?.note||'';
  refreshSignupBibField(g);
  if(inviteRow){inviteRow.style.display='none';document.getElementById('suInviteCode').value='';}
  // 家長區塊的顯示與旗標一律交給 updateParentalBlock 統一維護
  //（放在提早 return 之前，「未選組別」時旗標也會被正確重設為 false）
  updateParentalBlock();
  refreshSignupCf();
  // 邀請碼：組別自訂報名限制就用組別的，否則用賽事的
  if(inviteRow&&g&&inviteTarget(curSignupEvent,g))inviteRow.style.display='';
  if(!hint)return;
  // 限制說明：還沒選組別＝賽事的限制；選了組別＝這個組別適用的限制（自訂的就是組別的，沒自訂就是賽事的）
  if(!g){ const h=limitHintsFor(curSignupEvent,null); hint.textContent=h.length?'賽事報名限制：'+h.join('、'):''; return; }
  hint.textContent=groupHintText(g,limitHintsFor(curSignupEvent,g));
  hint.style.whiteSpace='pre-line';
}

// 依目前填寫的生日判斷是否需要顯示家長聲明區塊，並更新模組變數 curSignupNeedsParental
window.updateParentalBlock=function updateParentalBlock(){
  const group=document.getElementById('suGroup')?.value;
  const g=window._signupGroupMap?.[group];
  const block=document.getElementById('suParentalBlock');
  if(!block)return;
  const pAge=g?effParentalAge(curSignupEvent,g):0; // 組別自訂報名限制就用組別的，否則用賽事的
  if(!(pAge>0)){curSignupNeedsParental=false;block.style.display='none';return;}
  const birthday=document.getElementById('suBirthday')?.value.trim();
  if(birthday&&validateBirthday(birthday)){
    const evDate=curSignupEvent?.date||new Date().getFullYear()+'-01-01';
    const age=calcAgeRunner(birthday,evDate);
    // 算不出年齡（日期異常）時保守隱藏——伺服器端會用權威資料做最終判斷
    if(age===null||age>=pAge){curSignupNeedsParental=false;block.style.display='none';return;}
    curSignupNeedsParental=true;block.style.display='';
  }else{
    curSignupNeedsParental=false;block.style.display='none';
  }
}

window.calcAgeRunner=function calcAgeRunner(birthday,eventDate){
  if(!birthday||!eventDate)return null;
  const [by,bm,bd]=birthday.split(/[/-]/).map(Number);
  const [ey,em,ed]=eventDate.split(/[/-]/).map(Number);
  if(!by||!ey)return null;
  let age=ey-by;
  if(em<bm||(em===bm&&ed<bd))age--;
  return age;
}

// ── 自選號碼的有效範圍：最小值/最大值各自獨立判斷——有填就用填的值，
// 沒填的那一個用「位數」推算的預設（最小1，最大例如3位＝999），
// 兩個可以只填其中一個（例如只填最小值100＝範圍100~999），跟後台 Cloud Function 的驗證邏輯一致 ──
function bibEffRange(rMin,rMax,pad){
  return {min:rMin>0?rMin:1, max:rMax>0?rMax:(Math.pow(10,pad)-1)};
}
// 選手自選（報名自選號碼／選手自助改號碼）的有效範圍：優先用「自訂號碼範圍」，
// 沒設自訂範圍就退回用「號碼範圍」，兩個都沒設才用位數上限——三層各自獨立判斷（最小/最大分開）
function resolveSelfSelectBibRange(customMin,customMax,generalMin,generalMax,pad){
  const general=bibEffRange(generalMin,generalMax,pad);
  return {min:customMin>0?customMin:general.min, max:customMax>0?customMax:general.max};
}
// 依組別解析「有效」號碼設定：組別有開啟「自訂號碼規則」(bibOverride) 就用組別自己的設定，
// 沒開啟就退回賽事設定。位數固定用賽事層級，不受組別影響。
// evOverride：選填，不傳就用目前報名表單的 curSignupEvent（自助改號碼那裡查的是別的賽事文件，會自己傳進來）。
function getEffBibSettings(g,evOverride){
  const ev=evOverride||curSignupEvent||{};
  const pad=ev.bibPadLength||3;
  const useGroup=!!(g&&g.bibOverride);
  const allowCustomBib=useGroup?!!g.allowCustomBib:!!ev.allowCustomBib;
  const allowBibChange=useGroup?!!g.allowBibChange:!!ev.allowBibChange;
  const rMin=useGroup?(g.bibRangeMin||0):(ev.bibRangeMin||0);
  const rMax=useGroup?(g.bibRangeMax||0):(ev.bibRangeMax||0);
  const cMin=useGroup?(g.customBibRangeMin||0):(ev.customBibRangeMin||0);
  const cMax=useGroup?(g.customBibRangeMax||0):(ev.customBibRangeMax||0);
  const {min,max}=resolveSelfSelectBibRange(cMin,cMax,rMin,rMax,pad);
  const note=String((useGroup?g.bibNote:ev.bibNote)||'');
  return {pad,allowCustomBib,allowBibChange,min,max,note};
}

// ── 即時號碼重複檢查（自選號碼用）──
window.checkBibAvailable=async function(){
  const el=document.getElementById('suBib');
  const hint=document.getElementById('suBibHint');
  if(!el||!hint)return;
  const bib=el.value.trim();
  if(!bib){hint.textContent='';el.style.borderColor='';return;}
  const n=parseInt(bib);
  if(isNaN(n)||String(n)!==bib.replace(/^0+/,'')||n<1){
    el.style.borderColor='var(--red)';
    hint.innerHTML='<span style="color:var(--red)">❌ 請輸入正整數</span>';
    return;
  }
  if(!curSignupEvent){return;}
  const curG=window._signupGroupMap?.[document.getElementById('suGroup')?.value];
  const {pad,min:effMin,max:effMax}=getEffBibSettings(curG);
  // 範圍檢查
  if(n<effMin||n>effMax){
    el.style.borderColor='var(--red)';
    hint.innerHTML='<span style="color:var(--red)">❌ 號碼須在 '+effMin+'～'+effMax+' 之間</span>';
    return;
  }
  // 只查這一個號碼有沒有被用過，不下載整個報名集合
  const padded=String(n).padStart(pad,'0');
  const snap=await getDocs(query(collection(db,'events',curSignupEvent.id,'runners'),where('bibNumber','==',padded)));
  const dup=!snap.empty;
  if(dup){
    el.style.borderColor='var(--red)';
    hint.innerHTML='<span style="color:var(--red)">❌ 此號碼已被使用，請換一個</span>';
    // 偵測到衝突代表現在可能有很多人同時在搶號碼，快取可能已經整批過期，直接作廢，下次重新完整查詢
    delete availBibSetByEvent[curSignupEvent.id];
  }else{
    el.style.borderColor='var(--green)';
    hint.innerHTML='<span style="color:var(--green)">✅ 號碼 '+padded+' 可使用</span>';
  }
}

// ── 查看可用號碼（自選號碼用）：一次抓「已使用」的號碼集合（成本只跟目前報名人數有關，
// 跟號碼範圍大小無關），本地算出可用號碼，範圍太大就分批顯示，換一批不用再打一次Firestore。
// 報名表單、選手自助改號碼共用同一套邏輯，用 eventId 分開快取，DOM id 用參數傳入 ──
let availBibSetByEvent={}; // eventId -> Set
let availBibCursors={}; // panelId -> 目前批次起始號碼
const AVAIL_BIB_BATCH=30;
async function getUsedBibSetFor(eventId){
  if(availBibSetByEvent[eventId]) return availBibSetByEvent[eventId];
  const snap=await getDocs(collection(db,'events',eventId,'runners'));
  const set=new Set();
  snap.docs.forEach(d=>{const b=d.data().bibNumber; if(b)set.add(b);});
  availBibSetByEvent[eventId]=set;
  return set;
}
function countAvailBibsIn(usedSet,min,max){
  let usedInRange=0;
  usedSet.forEach(b=>{const n=parseInt(b,10); if(!isNaN(n)&&n>=min&&n<=max)usedInRange++;});
  return (max-min+1)-usedInRange;
}
// 可用號碼＝0時，把值還原成安全狀態＋提示，但不 disable 欄位——因為修改報名時「留空自動配」跟
// 「維持原本編號」都是合法選項，不受自訂範圍影響，硬鎖住欄位會讓使用者卡在其中一個選項、
// 沒辦法再自由切換到另一個（例如鎖住當下剛好空白，就再也打不了字改回原本的編號）
function lockBibFieldIfExhausted(min,max,pad,totalAvail,inputId,hintId){
  if(totalAvail>0)return false;
  const el=document.getElementById(inputId);
  const hint=document.getElementById(hintId);
  // 看目前是不是空白：本來就空白（＝要讓系統自動配號）就保持空白，不用還原；
  // 有值（打了一個不能用的號碼）才需要還原——報名表單沒有 data-old-bib，還原成空白；
  // 選手自助改號碼有 data-old-bib（原本的編號），還原回去，不清空造成看起來像資料不見。
  // 欄位還是可以編輯，之後照樣會經過失焦檢查／送出前檢查，不會因此送出無效號碼。
  if(el){
    if(el.value.trim()!=='') el.value=el.dataset.oldBib||'';
    el.style.borderColor='';
    el.placeholder='此範圍號碼已全部被使用';
  }
  if(hint)hint.innerHTML='<span style="color:var(--red)">❌ 此範圍（'+String(min).padStart(pad,'0')+'～'+String(max).padStart(pad,'0')+'）號碼已全部被使用，請留空由系統自動配號</span>';
  return true;
}
// 選手第一次點進號碼欄位時才查一次（不在頁面載入時就查，避免不打算自選號碼的人也多耗一次查詢）
async function checkBibExhaustedGeneric(eventId,rMin,rMax,pad,inputId,hintId){
  const el=document.getElementById(inputId);
  if(!el||el.disabled||el.dataset.exhaustChecked==='1'||!eventId)return;
  el.dataset.exhaustChecked='1';
  const used=await getUsedBibSetFor(eventId);
  const {min,max}=bibEffRange(rMin,rMax,pad);
  lockBibFieldIfExhausted(min,max,pad,countAvailBibsIn(used,min,max),inputId,hintId);
}
async function openAvailBibPanel(eventId,rMin,rMax,pad,inputId,hintId,panelId){
  const panel=document.getElementById(panelId);
  if(!panel||!eventId)return;
  if(panel.style.display==='block'){panel.style.display='none';return;}
  panel.style.display='block';
  panel.innerHTML='<div style="font-size:.75rem;color:var(--muted)">查詢可用號碼中...</div>';
  await getUsedBibSetFor(eventId);
  const {min}=bibEffRange(rMin,rMax,pad);
  availBibCursors[panelId]=min;
  renderAvailBibPanel(eventId,rMin,rMax,pad,inputId,hintId,panelId);
}
function renderAvailBibPanel(eventId,rMin,rMax,pad,inputId,hintId,panelId){
  const panel=document.getElementById(panelId);
  const used=availBibSetByEvent[eventId];
  if(!panel||!used)return;
  const {min,max}=bibEffRange(rMin,rMax,pad);
  const totalAvail=countAvailBibsIn(used,min,max);
  if(lockBibFieldIfExhausted(min,max,pad,totalAvail,inputId,hintId)){
    panel.innerHTML='<div style="font-size:.8rem;color:var(--red)">此範圍（'+String(min).padStart(pad,'0')+'～'+String(max).padStart(pad,'0')+'）號碼已全部被使用</div>';
    return;
  }
  const batch=[];
  let n=availBibCursors[panelId]||min;
  while(batch.length<AVAIL_BIB_BATCH && n<=max){
    const padded=String(n).padStart(pad,'0');
    if(!used.has(padded))batch.push(padded);
    n++;
  }
  const hasMore=n<=max;
  const nextCursor=hasMore?n:min;

// Turnstile 明確渲染：等api.js真的載入完成才呼叫render()，並記住widgetId供之後reset用。
// 每次報名表單重新建立（換賽事/換組別重繪）都要重新render一次，因為舊的container已經被換掉了。
let currentTurnstileToken='';
let turnstileWidgetId=null;
window.onTurnstileToken=function(token){ currentTurnstileToken=token; };
function renderTurnstileWidget(containerId){
  currentTurnstileToken='';
  turnstileWidgetId=null;
  const tryRender=()=>{
    const el=document.getElementById(containerId);
    if(!el)return; // 使用者已經切換到別的畫面，這個container不存在了，不用再等
    if(typeof turnstile==='undefined'){ setTimeout(tryRender,200); return; }
    el.innerHTML='';
    turnstileWidgetId=turnstile.render('#'+containerId,{
      sitekey:'0x4AAAAAAD9m_aLTaCTI6XIu',
      callback:onTurnstileToken,
    });
  };
  tryRender();
}
function resetTurnstileWidget(){
  currentTurnstileToken='';
  if(typeof turnstile!=='undefined'&&turnstileWidgetId!==null) turnstile.reset(turnstileWidgetId);
}
function waitForFreshTurnstileToken(timeoutMs=8000){
  return new Promise(resolve=>{
    const start=Date.now();
    (function check(){
      if(currentTurnstileToken){resolve(currentTurnstileToken);return;}
      if(Date.now()-start>timeoutMs){resolve('');return;}
      setTimeout(check,100);
    })();
  });
}

function idDialog(o){

  dlg.innerHTML='<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:480px;width:100%;box-sizing:border-box;max-height:90vh;overflow:auto">'
    +'<div style="font-size:1rem;font-weight:700;margin-bottom:8px">'+(o.who?esc(o.who)+'：':'')+esc(o.title)+'</div>'
    +(o.html||'')
    +(o.input?'<input id="idDlgInput" class="input" style="width:100%;box-sizing:border-box;margin:6px 0 4px" placeholder="'+esc(o.input.placeholder||'')+'">'+'<div id="idDlgErr" style="font-size:.75rem;color:var(--red);min-height:1em"></div>':'')
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+btns+'</div></div>';
  document.body.appendChild(dlg);
  const inp=dlg.querySelector('#idDlgInput');
  if(inp) setTimeout(()=>inp.focus(),30);
  return new Promise(resolve=>{
    dlg.querySelectorAll('button[data-i]').forEach(el=>el.onclick=()=>{
      const b=o.buttons[+el.dataset.i];

      if(b.needInput){ const err=b.needInput(v); if(err){ dlg.querySelector('#idDlgErr').textContent=err; return; } }
      dlg.remove(); resolve({value:b.value, input:v});
    });
  });
}

async function askIdentity(step, idq, who){

  if(step==='ever'){
    const r=await idDialog({who, title:'以前報名過本單位的賽事嗎？', html:idWhyHtml,
      buttons:[{label:'是，報名過',value:'yes',primary:true},{label:'否，第一次報名',value:'no'},{label:'取消',value:'cancel'}]});
    if(r.value==='cancel') return null;
    idq.ever=r.value; return idq;
  }
  if(step==='contact'){
    const r=await idDialog({who, title:'請填以前報名用的手機或 Email',
      html:'<div style="font-size:.82rem;line-height:1.7">有好幾位同姓名、同性別、同生日的選手，請填你以前報名時用的手機或 Email，用來找出你的資料。</div>',
      input:{placeholder:'09xxxxxxxx 或 Email'},
      buttons:[{label:'確定',value:'ok',primary:true,needInput:v=>(!v?'請填手機或 Email':(validatePhone(v)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))?'':'格式不正確')},
        {label:'不記得／沒填過',value:'skip'},{label:'取消',value:'cancel'}]});
    if(r.value==='cancel') return null;
    if(r.value==='skip'){ idq.noContact=true; return idq; }
    if(r.input.includes('@')) idq.email=r.input; else idq.phone=r.input;
    return idq;
  }
  if(step==='idNumber'){
    const r=await idDialog({who, title:'請填身分證字號',
      html:'<div style="font-size:.82rem;line-height:1.7">還是無法確定是哪一位，請填你的身分證字號（只用來比對，不會顯示）。</div>',
      input:{placeholder:'A123456789'},
      buttons:[{label:'確定',value:'ok',primary:true,needInput:v=>validateId(v.toUpperCase())&&v?'':'請填正確的身分證字號'},
        {label:'以前沒填過',value:'skip'},{label:'取消',value:'cancel'}]});
    if(r.value==='cancel') return null;
    if(r.value==='skip'){ idq.noIdNumber=true; return idq; }
    idq.idNumber=r.input.toUpperCase(); return idq;
  }
  if(step==='uid'){
    const r=await idDialog({who, title:'請填你的 ID',
      html:'<div style="font-size:.82rem;line-height:1.7">還是無法確定是哪一位，請填你的 ID。<br><span style="color:var(--muted)">ID 在以前的報名資訊卡上；也可以先到「查詢成績」用身分證＋生日查以前的紀錄。查不到請聯絡主辦單位。</span></div>',
      input:{placeholder:'ID'},
      buttons:[{label:'確定',value:'ok',primary:true,needInput:v=>v?'':'請填 ID'},{label:'取消',value:'cancel'}]});
    if(r.value==='cancel') return null;
    idq.uid=r.input.toUpperCase(); return idq;
  }
  return null;

// 自訂欄位顯示成確認畫面的列（區塊標題不列；複選用頓號連接；勾選框顯示是／否）
function cfConfirmRows(fields, data){
  const rows=[];
  (fields||[]).forEach(f=>{
    if(f.type==='section'||!(f.id in (data||{}))) return;
    let v=data[f.id];
    if(Array.isArray(v)) v=v.join('、'); else if(v===true) v='是'; else if(v===false) v='否';
    rows.push([f.label,v]);
  });
  return rows;
}

window.submitSignup=async function(){
  // 防止快速連點：從點擊到真正鎖住按鈕之間，中間有好幾個 await（邀請碼檢查、名額查詢等），
  // 使用者若在這段空檔又點一次，之前沒有任何防護，會導致同一份資料被送出好幾次
  // （報名管理頁看到同一人建立好幾筆記錄，多半就是這樣來的）。
  if(window._suSubmitting)return;
  window._suSubmitting=true;
  const btn=document.querySelector('#signupContent .btn-primary, #signupForm .btn-primary');
  if(btn){btn.textContent='送出中...';btn.disabled=true;}
  try{
  const eventId=curSignupEvent.id;
  const group=document.getElementById('suGroup').value;
  if(!group){showToast(Object.keys(window._signupGroupMap||{}).length?'請選擇組別':'此賽事尚未設定組別，目前無法報名','error');return;}
  const name=document.getElementById('suName').value.trim();
  const gender=document.getElementById('suGender').value;
  const birthday=document.getElementById('suBirthday').value.trim();
  const fs=curSignupEvent.fieldSettings||{};
  const phone=(fs.phone?.show!==false)?document.getElementById('suPhone')?.value.trim()||''  :'';
  const email=(fs.email?.show!==false)?document.getElementById('suEmail')?.value.trim()||''  :'';
  const idNumber=(fs.idNumber?.show!==false)?document.getElementById('suIdNumber')?.value.trim()||'':'';
  const note=document.getElementById('suNote').value.trim();

  if(!name){showToast('請填寫姓名','error');return;}
  if(!gender){showToast('請選擇性別','error');return;}
  if(!birthday){setFieldError('suBirthday',true);showToast('請填寫生日','error');return;}
  if(!/^\d{4}\/\d{2}\/\d{2}$/.test(birthday)){setFieldError('suBirthday',true);showToast('生日格式錯誤（yyyy/mm/dd）','error');return;}
  {
    const [by,bm,bd]=birthday.split('/').map(Number);
    const dt=new Date(by,bm-1,bd);
    const today=new Date();today.setHours(0,0,0,0);
    if(dt.getFullYear()!==by||dt.getMonth()!==bm-1||dt.getDate()!==bd){setFieldError('suBirthday',true);showToast('生日日期不存在','error');return;}
    if(dt>=today){setFieldError('suBirthday',true);showToast('生日不能是今天或未來日期','error');return;}
    if(by<1900){setFieldError('suBirthday',true);showToast('生日年份不合理','error');return;}
  }
  if(fs.phone?.show!==false){
    if(fs.phone?.required&&!phone){setFieldError('suPhone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError('suPhone',true);showToast('手機號碼格式錯誤（09開頭10碼）','error');return;}
  }
  if(fs.email?.show!==false){
    if(fs.email?.required&&!email){setFieldError('suEmail',true);showToast('請填寫 E-Mail','error');return;}
    if(!validateEmail(email)){setFieldError('suEmail',true);showToast('請填寫正確的Email格式','error');return;}
  }
  if(fs.idNumber?.show!==false){
    if(fs.idNumber?.required&&!idNumber){setFieldError('suIdNumber',true);showToast('請填寫身分證字號','error');return;}
    if(!validateId(idNumber)){setFieldError('suIdNumber',true);showToast('請填寫正確的身分證字號格式','error');return;}
  }

  // 組別限制驗證
  const inviteInput=document.getElementById('suInviteCode')?.value.trim()||'';
  const g=window._signupGroupMap?.[group];
  const suGroupHintEl=document.getElementById('suGroupHint');
  const failGroup=(msg)=>{
    if(suGroupHintEl){suGroupHintEl.textContent=msg;suGroupHintEl.style.color='var(--red)';}
    showToast(msg,'error');
  };
  if(g){
    // 報名限制：組別自訂報名限制就用組別的，否則用賽事的（伺服器端同一套規則）
    const limErr=regLimitError(curSignupEvent,g,gender,birthday,curSignupEvent?.date||'');
    if(limErr){failGroup(limErr);return;}
    const invT=inviteTarget(curSignupEvent,g);
    if(invT&&!(await checkInviteCode(invT,inviteInput))){failGroup('邀請碼不正確');return;}
    // 家長陪同聲明：送出前即時重算（依目前的組別＋生日），
    // 不依賴可能殘留的旗標
    updateParentalBlock();
    if(curSignupNeedsParental){
      const consent=document.getElementById('suParentalConsent');
      const parentName=document.getElementById('suParentName')?.value.trim()||'';
      const parentPhone=document.getElementById('suParentPhone')?.value.trim()||'';
      if(!consent?.checked){showToast('請勾選家長陪同聲明','error');return;}
      if(!parentName){showToast('請填寫緊急聯絡人姓名','error');return;}
      if(!parentPhone||!validatePhone(parentPhone)){showToast('請填寫正確的緊急聯絡人手機','error');return;}
    }
    // 組別名額
    if(g.groupCapacity>0){
      const capSnap=await getCountFromServer(query(collection(db,'events',curSignupEvent.id,'runners'),where('groupId','==',group)));
      if(capSnap.data().count>=g.groupCapacity){failGroup('此組別已額滿（'+g.groupCapacity+'人）');return;}
    }
  }

  // 自訂欄位必填驗證 + 收集（只處理顯示中的欄位；隱藏的欄位不驗證也不送出）
  const customData={};

    if(f.type==='section'||!suVis[f.id])continue;

    if(!el)continue;
    if(f.type==='multi'){ const r=readMultiField('su_cf_'+f.id,f); if(r.error){showToast(r.error,'error');return;} customData[f.id]=r.value; continue; }
    if(f.type==='checkbox'){
      if(f.required&&!el.checked){showToast('「'+f.label+'」為必填，請勾選','error');return;}
      customData[f.id]=el.checked;
    }
    else{
      let v=el.value.trim();
      if(f.type==='select'&&f.allowOther&&v==='__other__'){
        v=document.getElementById('su_cf_'+f.id+'_other')?.value.trim()||'';
      }
      if(f.required&&!v){showToast('「'+f.label+'」為必填','error');return;}
      customData[f.id]=v;
    }
  }

  const runnerData={name,gender,birthday,phone,email,idNumber,note};

  // 收集家長陪同資料（curSignupNeedsParental 已在上方即時重算過）
  const parentalDataForSet=(()=>{
    if(!curSignupNeedsParental)return{};
    const agreed=document.getElementById('suParentalConsent')?.checked||false;
    if(!agreed)return{};
    return{parentalConsentAgreed:true,parentName:document.getElementById('suParentName')?.value.trim()||'',parentPhone:document.getElementById('suParentPhone')?.value.trim()||''};
  })();
  // update 用版（隱藏時帶 deleteField，用於 updateDoc 已報名更新）
  const parentalDataForUpdate=curSignupNeedsParental
    ?parentalDataForSet
    :{parentalConsentAgreed:deleteField(),parentName:deleteField(),parentPhone:deleteField()};

  // 自選號碼（若開放且有填）
  const customBibEl=document.getElementById('suBib');
  const customBibRaw=customBibEl?customBibEl.value.trim():'';
  let customBib='';
  if(customBibRaw){
    const n=parseInt(customBibRaw);
    if(isNaN(n)||n<1){showToast('號碼請輸入正整數','error');return;}
    const {pad,min:effMin,max:effMax}=getEffBibSettings(g);
    if(n<effMin||n>effMax){
      showToast('號碼須在 '+effMin+'～'+effMax+' 之間','error');
      if(customBibEl)customBibEl.style.borderColor='var(--red)';
      return;
    }
    customBib=String(n).padStart(pad,'0');
  }
  // 若填了號碼，先做最終重複確認
  if(customBib){
    const dupSnap=await getDocs(query(collection(db,'events',curSignupEvent.id,'runners'),where('bibNumber','==',customBib)));
    if(!dupSnap.empty){
      showToast('號碼 '+customBib+' 已被使用，請重新填寫','error');
      if(customBibEl){customBibEl.style.borderColor='var(--red)';}
      // 偵測到衝突代表現在可能有很多人同時在搶號碼，快取可能已經整批過期，直接作廢，下次重新完整查詢
      delete availBibSetByEvent[curSignupEvent.id];
      return;

  try{
    // ══════════════════════════════════════════════════════════
    // 報名的所有「真正的檢查與寫入」已搬進 Cloud Function
    // （functions/index.js 的 runnerSignup），在伺服器端以原子交易處理：
    //   - 比對現有選手（個資不再下載到瀏覽器）
    //   - 名額 / 邀請碼 / 年齡性別限制（無法被繞過，名額不會超收）
    //   - 重複報名檢查、流水號與號碼配發（不會撞號）
    // 上面的前端檢查只是使用體驗的預檢，把關以伺服器為準。
    // ══════════════════════════════════════════════════════════
    // 送出前確認資料
    btn.textContent='送出報名'; btn.disabled=false;
    const okGo=await confirmBeforeSubmit([{rows:[['賽事',curSignupEvent.name||''],['組別',g?.name||''],['姓名',name],['性別',gender],['生日',birthday],['手機',phone],['Email',email],['身分證',idNumber],['號碼',customBib],['備註',note]].concat(cfConfirmRows(curSignupCustomFields,customData))}]);
    if(!okGo) return;
    btn.textContent='送出中...'; btn.disabled=true;
    if(!currentTurnstileToken){showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error');btn.textContent='送出報名';btn.disabled=false;return;}
    const runnerSignupFn=httpsCallable(functions,'runnerSignup');
    const payload={
      eventId,groupId:group,name,gender,birthday,phone,email,idNumber,note,customData,
      inviteCode:document.getElementById('suInviteCode')?.value.trim()||'',
      customBib:customBib||'',
      turnstileToken:currentTurnstileToken,
      parental:(parentalDataForSet.parentalConsentAgreed
        ?{consent:true,parentName:parentalDataForSet.parentName,parentPhone:parentalDataForSet.parentPhone}
        :null),
      identity:{}
    };
    let idq={};
    let res=(await runnerSignupFn(payload)).data;
    // 找到同姓名、同性別、同生日的人：一題一題確認身分，再帶著答案重送
    // （伺服器只回傳要問哪一題，不回傳任何欄位的相符或差異，避免被拿來探測別人的資料）
    while(res.status==='needs-identity'){
      btn.textContent='送出報名'; btn.disabled=false;
      const nx=await askIdentity(res.step,idq,'');
      if(!nx){ resetTurnstileWidget(); return; }
      idq=nx;
      btn.textContent='送出中...'; btn.disabled=true;
      resetTurnstileWidget();
      const freshToken=await waitForFreshTurnstileToken();
      res=(await runnerSignupFn({...payload,turnstileToken:freshToken,identity:idq})).data;
    }

    // 已報名過這場活動的情況，伺服器現在會直接拋錯（引導去用修改功能），
    // 不會再回傳 already-registered/reactivated 這兩種狀態，所以這裡不用特別處理，
    // 會直接落到下面的 catch 顯示錯誤訊息
    // 這次報名可能用掉一個號碼（自選或自動配號），「查看可用號碼」的快取要清掉，
    // 不然剛用掉的號碼要重整頁面才會反映
    delete availBibSetByEvent[curSignupEvent.id];
    showSignupSuccess({uniqueId:res.uniqueId,name,gender,group:g?.name||group,bibNumber:res.bibNumber,eventName:curSignupEvent.name,eventDate:curSignupEvent.date});
  }catch(e){
    showToast('報名失敗：'+e.message,'error');
    resetTurnstileWidget();
    const b=document.querySelector('#signupContent .btn-primary, #signupForm .btn-primary');
    if(b){b.textContent='送出報名';b.disabled=false;}
  }
  } finally {
    // 不管上面驗證中途 return、成功、還是失敗，這裡都會執行，
    // 確保鎖一定會解開、按鈕一定會恢復，不會卡死
    window._suSubmitting=false;
    if(btn){btn.disabled=false;btn.textContent='送出報名';}
  }
}

// ── 把畫面上的某個區塊存成 PNG ──
// 電腦：直接下載檔案
// 手機／LINE、FB 等 App 內建瀏覽器：下載常常沒反應，改成跳出圖片預覽，
// 讓使用者長按圖片存到相簿（預覽裡另有「下載／分享」按鈕可試）
async function saveElementAsPng(el,filename){
  if(!el)return;
  if(typeof html2canvas==='undefined'){showToast('圖片功能載入失敗，請改用截圖保存','error');return;}
  showToast('正在產生圖片...');
  let canvas;
  try{
    const bg=getComputedStyle(document.body).backgroundColor||'#0f1117';
    // 要截的區塊本身不是卡片（例如查詢結果裡的報名資訊）時，匯出時補上卡片外框和留白，圖片才不會貼邊
    const needFrame=!el.classList.contains('card')&&el.id;
    canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:bg,
      onclone:doc=>{
        if(!needFrame)return;
        const c=doc.getElementById(el.id);
        if(c)Object.assign(c.style,{padding:'20px',border:'1px solid #2e3349',borderRadius:'14px',background:'#1a1d27'});
      }});
  }catch(e){showToast('圖片產生失敗，請改用截圖保存','error');return;}
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); // iPadOS 會偽裝成 Mac
  if(isMobile||!blob){showPngPreview(canvas.toDataURL('image/png'),blob,filename);return;}
  downloadBlob(blob,filename);
  showToast('圖片已下載');
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function showPngPreview(dataUrl,blob,filename){
  let ov=document.getElementById('pngPreviewOverlay');
  if(ov)ov.remove();
  ov=document.createElement('div');
  ov.id='pngPreviewOverlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;font-size:.95rem;text-align:center">長按圖片即可儲存到相簿</div>'
    +'<img src="'+dataUrl+'" style="max-width:100%;max-height:68vh;border-radius:12px;-webkit-touch-callout:default;user-select:auto">'
    +'<div style="display:flex;gap:8px;width:100%;max-width:360px">'
    +'<button class="btn btn-ghost" style="flex:1" data-act="close">關閉</button>'
    +(blob?'<button class="btn btn-primary" style="flex:1" data-act="save">下載／分享</button>':'')
    +'</div>';
  ov.addEventListener('click',async e=>{
    const act=e.target.dataset?.act;
    if(act==='close'||e.target===ov){ov.remove();return;}
    if(act==='save'&&blob){
      const file=new File([blob],filename,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file]});return;}
        catch(err){if(err.name==='AbortError')return;}
      }
      downloadBlob(blob,filename);
    }
  });
  document.body.appendChild(ov);
}

// 查詢狀態的驗證憑證與資料快取：
// 選手個資已從公開可讀的資料庫下架，查詢/修改/取消全部改走 Cloud Function
// （runnerStatus / runnerAction），每個動作都在伺服器端重新驗證身分。
// 這裡暫存查詢時輸入的憑證（姓名/性別/生日）供後續動作使用。
let statusCred=null;
let statusCache={};
window.doStatusQuery=async function(){
  if(!curStatusEvent){showToast('請先選擇賽事','error');return;}
  const bib=document.getElementById('statusBib').value.trim();
  const name=document.getElementById('statusName').value.trim();
  const gender=document.getElementById('statusGender').value;
  const birthday=document.getElementById('statusBirthday').value.trim();
  const result=document.getElementById('statusResult');
  const needBib=curStatusEvent.queryRequireBib===true;
  if(!name||!gender||!birthday||(needBib&&!bib)){showToast(needBib?'請填寫全部四個欄位':'請填寫姓名、性別、生日','error');return;}
  result.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';

  const eventId=curStatusEvent.id;
  const ev=curStatusEvent;
  let res;
  try{
    res=(await httpsCallable(functions,'runnerStatus')({eventId,bib,name,gender,birthday})).data;
  }catch(err){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查詢失敗：'+esc(err.message)+'</div></div>';
    return;
  }
  statusCred={name,gender,birthday};
  statusCache={};
  if(res.needBib){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">找到多筆相同姓名、性別、生日的資料，請加填編號再查詢</div></div>';
    return;
  }

  let html=''; let found=false;
  const matched=[];
  for(const m of (res.matched||[])){
    const e=m.entry;
    const eDoc={id:m.entryDocId};
    const entryName=m.profile.name||'';
    statusCache[m.entryDocId]=m;
    found=true;
    matched.push({eDoc, e});
    const cardId='statusCard_'+eventId+'_'+eDoc.id;
    html+='<div class="card" id="'+cardId+'">';
    // 報名資訊（跟報名成功畫面同一個版面），存成圖片時只截這一塊，下面的按鈕不會入鏡
    html+='<div id="'+cardId+'_info" style="background:var(--surface)"></div>';
    html+='<button class="btn btn-primary btn-full" style="margin-top:12px" onclick="saveStatusInfoPng(\''+cardId+'\',\''+eDoc.id+'\')">📥 存成圖片（PNG）</button>';
    if(isRunnerRegOpen(ev, 0)){
      if(e.cancelRequested){
        html+='<div id="'+cardId+'_actions">';
        html+='<div style="padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:.82rem;color:var(--muted);margin-bottom:8px">⏳ 已送出取消申請，請等待主辦方確認</div>';
        html+='<button class="btn btn-ghost btn-full" onclick="withdrawCancelRequest(\''+eventId+'\',\''+eDoc.id+'\',\''+escJs(e.uniqueId)+'\',\''+cardId+'\')">↩️ 撤銷取消申請</button>';
        html+='</div>';
      } else {
        html+='<div id="'+cardId+'_actions">';
        html+='<div id="'+cardId+'_edit" style="margin-top:12px"></div>';
        html+='<div style="display:flex;gap:8px;margin-top:8px">';
        html+='<button class="btn btn-ghost btn-full" onclick="showEditForm(\''+eventId+'\',\''+eDoc.id+'\',\''+escJs(e.uniqueId)+'\',\''+cardId+'\')">✏️ 修改報名資料</button>';
        html+='<button class="btn btn-danger btn-sm" onclick="requestCancelEntry(\''+eventId+'\',\''+eDoc.id+'\',\''+cardId+'\')">🗑️ 申請取消報名</button>';
        html+='</div>';
        html+='</div>';
      }
    }
    html+='</div>';
  }
  if(!found){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查無資料，請確認四項資料是否正確</div></div>';
    return;
  }
  result.innerHTML=html;
  for(const {eDoc} of matched){
    renderStatusInfo('statusCard_'+eventId+'_'+eDoc.id, eDoc.id);
  }
}

window.checkEditBibAvailable=async function(eventId, entryDocId, cardId){
  const el=document.getElementById(cardId+'_eBib');
  const hint=document.getElementById(cardId+'_eBibHint');
  if(!el||!hint)return;
  const bib=el.value.trim();
  if(!bib){hint.textContent='';el.style.borderColor='';return;}
  const n=parseInt(bib);
  if(isNaN(n)||n<1){
    el.style.borderColor='var(--red)';
    hint.innerHTML='<span style="color:var(--red)">❌ 請輸入正整數</span>';
    return;
  }
  // 範圍檢查（從 hidden input 讀取）——如果填的其實跟原本一樣（沒有要換），不套用範圍限制，
  // 理由跟送出驗證一致：範圍後來被調整過的話，選手還是要能保留自己原本的號碼
  const rangeEl=document.getElementById(cardId+'_bibRange');
  const pad=rangeEl?parseInt(rangeEl.dataset.pad)||3:3;
  const padded=String(n).padStart(pad,'0');
  const oldBib=rangeEl?(rangeEl.dataset.oldBib||''):'';
  if(padded!==oldBib){
    const rMin=rangeEl?parseInt(rangeEl.dataset.min)||0:0;
    const rMax=rangeEl?parseInt(rangeEl.dataset.max)||0:0;
    const {min:effMin,max:effMax}=bibEffRange(rMin,rMax,pad);
    if(n<effMin||n>effMax){
      el.style.borderColor='var(--red)';
      hint.innerHTML='<span style="color:var(--red)">❌ 號碼須在 '+effMin+'～'+effMax+' 之間</span>';
      return;
    }
  }
  const snap=await getDocs(query(collection(db,'events',eventId,'runners'),where('bibNumber','==',padded)));
  const dup=snap.docs.some(d=>d.id!==entryDocId);
  if(dup){
    el.style.borderColor='var(--red)';
    hint.innerHTML='<span style="color:var(--red)">❌ 此號碼已被使用</span>';
    // 偵測到衝突代表現在可能有很多人同時在搶號碼，快取可能已經整批過期，直接作廢，下次重新完整查詢
    delete availBibSetByEvent[eventId];
  }else{
    el.style.borderColor='var(--green)';
    hint.innerHTML='<span style="color:var(--green)">✅ 號碼 '+padded+' 可使用</span>';
  }
}

// 修改表單：依目前選擇的組別，顯示組別註解與限制摘要
// （跟新報名表單的 onSignupGroupChange 邏輯一致；灰字=純資訊提示，真的驗證失敗時另外在 saveEditEntry 裡改成紅字）
window.updateEditGroupInfo=function(cardId, gMapJson){
  const noteEl=document.getElementById(cardId+'_eGroupNote');
  const hint=document.getElementById(cardId+'_eGroupHint');
  if(!noteEl||!hint)return;
  let gMap={}; try{gMap=JSON.parse(gMapJson);}catch(e){}
  const group=document.getElementById(cardId+'_eGroup')?.value;
  const g=gMap[group];
  noteEl.textContent=g?.note||'';
  if(!g){ const h=limitHintsFor(gMap.__ev,null); hint.textContent=h.length?'賽事報名限制：'+h.join('、'):''; return; }
  hint.textContent=groupHintText(g,limitHintsFor(gMap.__ev,g));
  hint.style.whiteSpace='pre-line';
  hint.style.color='var(--muted)';
}
// 組別提示文字：第一行「組別資訊」（距離、計時方式），第二行「此組別限制」
// 報名表單、修改表單共用，兩邊才不會各寫一套
function groupHintText(g, limitHints){
  const info=[certDistText(g.distance,g.distanceUnit), g.timed===false?'不計時':'計時'].filter(Boolean);
  const lines=['組別資訊：'+info.join('、')];
  if(limitHints.length)lines.push('此組別報名限制：'+limitHints.join('、'));
  return lines.join('\n');
}

// 修改表單：依生日/組別更新家長陪同區塊顯示
// 判斷結果寫在 block.dataset.need（每張卡片各自獨立），
// 取代原本的全域旗標——舊寫法同時開兩張卡的編輯表單時會互相覆蓋，
// 「是否需要家長欄位」會變成最後一次判斷的那張卡的值。
window.updateEditParentalBlock=function(cardId, gMapJson, evDate){
  const block=document.getElementById(cardId+'_eParentalBlock');
  if(!block)return false;
  const set=(need)=>{block.dataset.need=need?'1':'';block.style.display=need?'':'none';return need;};
  try{
    const gMap=JSON.parse(gMapJson);
    const group=document.getElementById(cardId+'_eGroup')?.value;
    const birthday=document.getElementById(cardId+'_eBirthday')?.value.trim();
    const g=gMap[group];
    const pAge=g?effParentalAge(gMap.__ev,g):0; // 組別自訂報名限制就用組別的，否則用賽事的
    if(!(pAge>0))return set(false);
    if(!(birthday&&validateBirthday(birthday)))return set(false);
    const base=evDate||new Date().getFullYear()+'-01-01';
    const age=calcAgeRunner(birthday,base);
    // 算不出年齡（日期異常）時保守隱藏——伺服器端會做最終判斷
    return set(!(age===null||age>=pAge));
  }catch(e){return set(false);}
}

window.saveEditEntry=async function(eventId,entryDocId,cardId){
  let fs={}; try{fs=JSON.parse(document.getElementById(cardId+'_edit')?.dataset.fs||'{}');}catch(e){}
  const name=document.getElementById(cardId+'_eName').value.trim();
  const gender=document.getElementById(cardId+'_eGender').value;
  const birthday=document.getElementById(cardId+'_eBirthday').value.trim();
  const phone=(fs.phone?.show!==false)?(document.getElementById(cardId+'_ePhone')?.value.trim()||''):'';
  const email=(fs.email?.show!==false)?(document.getElementById(cardId+'_eEmail')?.value.trim()||''):'';
  const idNumber=(fs.idNumber?.show!==false)?(document.getElementById(cardId+'_eIdNumber')?.value.trim()||''):'';
  const note=document.getElementById(cardId+'_eNote').value.trim();
  const groupId=document.getElementById(cardId+'_eGroup').value;
  if(!groupId){showToast('請選擇組別','error');return;}
  const bibEl=document.getElementById(cardId+'_eBib');
  const rangeEl=document.getElementById(cardId+'_bibRange');
  const newBibRaw=bibEl?bibEl.value.trim():'';
  let newBib='';
  // 欄位存在(rangeEl存在＝允許改號碼) + 使用者主動清空 = 要求系統重新自動配號（不是「沒改」，是明確要換）
  const wantAutoBib=!!rangeEl&&newBibRaw==='';
  if(newBibRaw){
    const n=parseInt(newBibRaw);
    if(isNaN(n)||n<1){showToast('號碼請輸入正整數','error');return;}
    const pad=rangeEl?parseInt(rangeEl.dataset.pad)||3:3;
    const padded=String(n).padStart(pad,'0');
    const oldBib=rangeEl?(rangeEl.dataset.oldBib||''):'';
    // 只有「真的要換一個不一樣的號碼」才套用範圍限制——範圍後來被調整過的話，
    // 選手還是要能保留自己原本的號碼，不能因此被擋下無法送出
    if(padded!==oldBib){
      const rMin=rangeEl?parseInt(rangeEl.dataset.min)||0:0;
      const rMax=rangeEl?parseInt(rangeEl.dataset.max)||0:0;
      const {min:effMin,max:effMax}=bibEffRange(rMin,rMax,pad);
      if(n<effMin||n>effMax){
        showToast('號碼須在 '+effMin+'～'+effMax+' 之間','error');
        if(bibEl)bibEl.style.borderColor='var(--red)';
        return;
      }
    }
    // 真的要換號碼的話，送出前再確認一次沒被搶走（跟報名表單同一套邏輯，失焦檢查只是輔助不是保證）
    if(padded!==oldBib){
      const dupSnap=await getDocs(query(collection(db,'events',eventId,'runners'),where('bibNumber','==',padded)));
      if(dupSnap.docs.some(d=>d.id!==entryDocId)){
        showToast('號碼 '+padded+' 已被使用，請重新填寫','error');
        if(bibEl)bibEl.style.borderColor='var(--red)';
        // 偵測到衝突代表現在可能有很多人同時在搶號碼，快取可能已經整批過期，直接作廢，下次重新完整查詢
        delete availBibSetByEvent[eventId];
        return;
      }
    }
    newBib=padded;
  }
  if(!name){showToast('姓名為必填','error');return;}
  if(!gender){showToast('性別為必選','error');return;}
  if(!birthday){setFieldError(cardId+'_eBirthday',true);showToast('生日為必填','error');return;}
  if(!validateBirthday(birthday)){setFieldError(cardId+'_eBirthday',true);showToast('生日格式錯誤或不合理（不能是未來日期）','error');return;}
  setFieldError(cardId+'_eBirthday',false);
  if(fs.phone?.show!==false){
    if(fs.phone?.required&&!phone){setFieldError(cardId+'_ePhone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError(cardId+'_ePhone',true);showToast('手機號碼格式錯誤','error');return;}
    setFieldError(cardId+'_ePhone',false);
  }
  if(fs.email?.show!==false){
    if(fs.email?.required&&!email){setFieldError(cardId+'_eEmail',true);showToast('請填寫 E-Mail','error');return;}
    if(email&&!validateEmail(email)){setFieldError(cardId+'_eEmail',true);showToast('Email格式錯誤','error');return;}
    setFieldError(cardId+'_eEmail',false);
  }
  if(fs.idNumber?.show!==false){
    if(fs.idNumber?.required&&!idNumber){setFieldError(cardId+'_eIdNumber',true);showToast('請填寫身分證字號','error');return;}
    if(idNumber&&!validateId(idNumber)){setFieldError(cardId+'_eIdNumber',true);showToast('身分證格式錯誤','error');return;}
    setFieldError(cardId+'_eIdNumber',false);
  }
  // 組別限制驗證（性別/年齡/名額；邀請碼組別不開放在編輯時切換，維持原行為）
  // ── 灰字提示跟錯誤紅字共用同一個 eGroupHint 元素：平常是 updateEditGroupInfo() 寫入的灰字摘要，
  //    這裡驗證失敗時覆寫成紅字錯誤訊息，跟管理員端 eGroupHint 的顏色邏輯一致
  {
    const editBox0=document.getElementById(cardId+'_edit');
    let gMap0={}; try{gMap0=JSON.parse(editBox0?.dataset.gmap||'{}');}catch(e){}
    const g0=gMap0[groupId];
    const groupHintEl=document.getElementById(cardId+'_eGroupHint');
    const failGroup=(msg)=>{
      if(groupHintEl){groupHintEl.textContent=msg;groupHintEl.style.color='var(--red)';}
      showToast(msg,'error');
    };
    if(g0){
      // 報名限制：組別自訂報名限制就用組別的，否則用賽事的
      const limErr=regLimitError(gMap0.__ev,g0,gender,birthday,editBox0?.dataset.evdate||'');
      if(limErr){failGroup(limErr);return;}
      // 名額只在「真的換到不同組別」時才檢查，避免原本就在額滿組別的人被自己卡住
      const origGroupId=statusCache[entryDocId]?.entry?.groupId;
      if(groupId!==origGroupId&&g0.groupCapacity>0){
        const capSnap=await getCountFromServer(query(collection(db,'events',eventId,'runners'),where('groupId','==',groupId)));
        if(capSnap.data().count>=g0.groupCapacity){failGroup('此組別已額滿（'+g0.groupCapacity+'人）');return;}
      }
    }
  }
  const customFields=JSON.parse(document.getElementById(cardId+'_edit').dataset.customFields||'[]');
  const customData={};
  const editVis=updateEditCustomFieldsVisibility(cardId);
  for(const f of customFields){
    if(f.type==='section'||!editVis[f.id])continue; // 隱藏的欄位（不適用組別、顯示條件不成立）：不送出，等同清除
    const el=document.getElementById(cardId+'_ecf_'+f.id); if(!el)continue;
    if(f.type==='multi'){ const r=readMultiField(cardId+'_ecf_'+f.id,f); if(r.error){showToast(r.error,'error');return;} customData[f.id]=r.value; continue; }
    if(f.type==='checkbox'){
      if(f.required&&!el.checked){showToast('「'+f.label+'」為必填，請勾選','error');return;}
      customData[f.id]=el.checked;
    }
    else{
      let v=el.value.trim();
      if(f.type==='select'&&f.allowOther&&v==='__other__'){
        v=document.getElementById(cardId+'_ecf_'+f.id+'_other')?.value.trim()||'';
      }
      if(f.required&&!v){showToast('「'+f.label+'」為必填','error');return;}
      customData[f.id]=v;
    }
  }
  // 家長陪同欄位：儲存前依「目前表單的組別＋生日」即時重算是否需要
  const editBox=document.getElementById(cardId+'_edit');
  const needParental=updateEditParentalBlock(cardId,editBox?.dataset.gmap||'{}',editBox?.dataset.evdate||'');
  let parentalData={};
  if(needParental){
    const consent=document.getElementById(cardId+'_eParentalConsent')?.checked||false;
    const parentName=document.getElementById(cardId+'_eParentName')?.value.trim()||'';
    const parentPhone=document.getElementById(cardId+'_eParentPhone')?.value.trim()||'';
    if(!consent){showToast('請勾選家長陪同聲明','error');return;}
    if(!parentName){showToast('請填寫緊急聯絡人姓名','error');return;}
    if(!parentPhone||!validatePhone(parentPhone)){showToast('請填寫正確的緊急聯絡人手機','error');return;}
    parentalData={parentalConsentAgreed:true,parentName,parentPhone};
  }
  try{
    // 全部交給 Cloud Function：伺服器端重新驗證身分後，原子地更新個人資料
    // 與報名資料（含改號碼的防撞號交易與家長陪同/必填欄位的伺服器端驗證）
    const callPayload={
      eventId,entryDocId,action:'save',credentials:statusCred,
      profile:{name,gender,birthday,phone,email,idNumber,note},
      entry:{groupId,customData,newBib:newBib||'',wantAutoBib},
      parental:(needParental
        ?{consent:document.getElementById(cardId+'_eParentalConsent')?.checked||false,
          parentName:document.getElementById(cardId+'_eParentName')?.value.trim()||'',
          parentPhone:document.getElementById(cardId+'_eParentPhone')?.value.trim()||''}
        :null)
    };
    let res=(await httpsCallable(functions,'runnerAction')(callPayload)).data;
    // 改了姓名、性別、生日或身分證（從一個號碼改成另一個）：確認是同一人修改資料（不能換人）
    if(res.status==='confirm-identity-change'){
      if(!(await confirmIdentityChange(res.fields||[],''))) return;
      res=(await httpsCallable(functions,'runnerAction')({...callPayload,confirmIdentityChange:true})).data;
    }
    // 憑證與快取更新（姓名/性別/生日可能被改了，之後的動作要用新值驗證）
    statusCred=res.updatedCredentials||statusCred;
    const cached=statusCache[entryDocId];
    if(cached){
      const bibChanged=!!res.newBib&&res.newBib!==cached.entry.bibNumber;
      Object.assign(cached.profile,{name,gender,birthday,phone,email,idNumber,note});
      const groupName=document.getElementById(cardId+'_eGroup')?.selectedOptions?.[0]?.textContent||cached.entry.group;
      Object.assign(cached.entry,{group:groupName,groupId,customData,bibNumber:res.newBib||cached.entry.bibNumber});
      // 卡片上的報名資訊是查詢當下一次性畫好的，存檔成功後要手動重畫，
      // 不然畫面（含 QR Code 裡的編號）看起來會像沒改到（資料庫其實已經改好了）
      renderStatusInfo(cardId, entryDocId);
      // 編號真的有變動的話，「查看可用號碼」的快取要清掉，不然剛用掉/剛空出來的號碼要重整頁面才會反映
      if(bibChanged) delete availBibSetByEvent[eventId];
    }
    showToast('已儲存修改');
    document.getElementById(cardId+'_edit').innerHTML='<div class="csv-hint">✅ 修改已儲存</div>';
  }catch(err){
    showToast('儲存失敗：'+err.message,'error');
  }
}

window.doLookup=async function(){
  const isAll=document.getElementById('lookupAllEvents').checked;
  const eventId=document.getElementById('lookupEventSelect').value;
  const uid=document.getElementById('lookupId').value.trim();
  const idNum=document.getElementById('lookupIdNum').value.trim();
