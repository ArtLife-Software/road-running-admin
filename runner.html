  if(!uid&&!idNum){showToast('請輸入 ID 或身分證字號（擇一）','error');return;}
  if(!isAll&&!eventId){showToast('請先選擇賽事','error');return;}
  result.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';
  certDataStore.length=0;

  // 身分比對改由 Cloud Function（runnerLookup）在伺服器端處理：
  // 選手主檔（含個資）已不開放讀取，伺服器驗證「(ID 或身分證) + 生日」
  // 相符後，只回傳報名記錄的基本資料（姓名/編號/組別），成績明細
  // 仍由本頁讀取公開的打卡記錄組出。
  let res;
  try{
    res=(await httpsCallable(functions,'runnerLookup')({
      eventId:isAll?'all':eventId, uid, idNumber:idNum, birthday
    })).data;
  }catch(err){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查詢失敗：'+esc(err.message)+'</div></div>';
    return;
  }
  const matched=res.matched||[];
  if(!matched.length){result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查無資料，請確認填寫的資料是否正確</div></div>';return;}

  // 依賽事分組（同一場找到多筆時，提示同時輸入 ID 和身分證）
  const byEvent=new Map();
  matched.forEach(m=>{
    if(!byEvent.has(m.eventId))byEvent.set(m.eventId,{evName:m.evName,evDate:m.evDate,evOrganizer:m.evOrganizer,items:[]});
    byEvent.get(m.eventId).items.push(m);
  });
  let html='';
  for(const [evId,grp] of byEvent){
    if(grp.items.length>1){
      html+='<div class="card"><div style="font-size:.85rem;color:var(--muted)">'+esc(grp.evName)+'（'+esc(grp.evDate||'日期不詳')+'）</div><div style="color:var(--accent);font-size:.85rem;margin-top:4px">找到多筆符合資料，請同時輸入 ID 和身分證字號</div></div>';
      continue;
    }
    html+=await buildLookupCard(grp.items[0].entry, evId, isAll?{name:grp.evName,date:grp.evDate,organizer:grp.evOrganizer}:null);
  }
  result.innerHTML=html;
}
// ── 組別名次計算（admin.html 與 runner.html 同一套規則，改一邊要同步改另一邊）──
// 起點一律用「第一站」的打卡時間（原本用「這位選手最早的一筆記錄」，漏刷起點時會拿第二站當起點，時間變短、名次變前面）
// 各站名次：有第一站、也有該站記錄的人，依累積時間排序 → key：uid+'_'+站點ID
// 終點名次：全部站點都有打卡的人，依總時間排序 → key：uid（漏刷任何一站就沒有終點名次）
// recsByUid：{uid: [該選手的打卡記錄（依時間由早到晚）]}；同一站重複打卡取最早那筆
function computeGroupRanks(stations, uids, recsByUid){
  const map={};
  if(!stations||!stations.length) return map;
  const ms=r=>(r&&r.scanTime&&r.scanTime.toDate)?r.scanTime.toDate().getTime():null;
  const at=(uid,sid)=>ms((recsByUid[uid]||[]).find(r=>r.stationId===sid));
  const startId=stations[0].id;
  stations.slice(1).forEach(s=>{
    const list=[];
    uids.forEach(uid=>{ const st=at(uid,startId), t=at(uid,s.id); if(st!==null&&t!==null) list.push({uid,v:t-st}); });
    list.sort((a,b)=>a.v-b.v).forEach((x,i)=>{map[x.uid+'_'+s.id]=i+1;});
  });
  const lastId=stations[stations.length-1].id;
  const fin=[];
  uids.forEach(uid=>{
    if(!stations.every(s=>at(uid,s.id)!==null)) return;
    fin.push({uid,v:at(uid,lastId)-at(uid,startId)});
  });
  fin.sort((a,b)=>a.v-b.v).forEach((x,i)=>{map[x.uid]=i+1;});
  map.__finishers=fin.length; // 組別完賽人數（證書變數 {組別完賽人數} 用）
  return map;
}
function groupRecsByUid(recs){
  const m={};
  recs.forEach(r=>{ (m[r.uniqueId]=m[r.uniqueId]||[]).push(r); });
  return m;
}

async function buildLookupCard(e, eventId, evData){
  // 先發出讀取，下面算成績的同時一起等
  const certSettingsP=Promise.all([loadCertSettings(eventId,'certificate'),loadCertSettings(eventId,'award')]);
  let certEventInfo = evData;
  if (!certEventInfo) {
    const evSnap = await getDoc(doc(db,'events',eventId));
    certEventInfo = evSnap.exists() ? {name:evSnap.data().name||'', date:evSnap.data().date||'', organizer:evSnap.data().organizer||''} : {name:'',date:'',organizer:''};
  }
  const recSnap=await getDocs(query(collection(db,'events',eventId,'records'),orderBy('scanTime','asc')));
  const groupRecs=recSnap.docs.map(d=>d.data()); // 整個賽事的打卡記錄（不含個資，選手端可讀）
  const allRecs=groupRecs.filter(x=>x.uniqueId===e.uniqueId);
  const [gSnap,checkpointSnap,ckSnap]=await Promise.all([
    getDocs(query(collection(db,'events',eventId,'groups'),orderBy('createdAt','asc'))),
    getDocs(collection(db,'events',eventId,'checkpoints')),
    getDocs(collection(db,'events',eventId,'checkins')).catch(()=>null) // 證書變數 {組別報到人數} 用；讀不到就留空
  ]);
  const checkinIds=ckSnap?new Set(ckSnap.docs.map(d=>d.id)):null;
  // 站點名稱一律即時查詢目前的 checkpoints 名稱；組別/站點比對一律用ID，
  // 改名字不影響任何比對正確性，也不需要連鎖同步。
  const checkpointNameById={}; checkpointSnap.docs.forEach(d=>{checkpointNameById[d.id]=d.data().name||'';});
  const groupFinishLimit={};
  let stations=[]; // [{id,name}]，依站序
  gSnap.docs.forEach(d=>{
    if(d.id===e.groupId) stations=(d.data().stationRefs||[]).map(cid=>({id:cid,name:checkpointNameById[cid]||'（已刪除的站點）'}));
    groupFinishLimit[d.id]=d.data().finishTimeLimit||0;
  });
  const finishTimeLimit=groupFinishLimit[e.groupId]||0;

  // 抓同組別其他選手的報名記錄，用來計算名次（跟後台查詢成績同一套邏輯：
  // 依「第一站到各站」的累積時間排序，只有抵達終點的人才有終點排名）
  const sameGroupSnap=await getDocs(query(collection(db,'events',eventId,'runners'),where('groupId','==',e.groupId)));
  const groupUids=sameGroupSnap.docs.map(d=>d.data().uniqueId);
  const lastStation=stations[stations.length-1];
  const recsByUid=groupRecsByUid(groupRecs);
  const rankMap=computeGroupRanks(stations, groupUids, recsByUid); // key: uid 或 uid+'_'+stationId
  const evTitle=evData?'<div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">'+esc(evData.name)+(evData.date?' ・ '+esc(evData.date):'')+'</div>':'';
  const finalRank=rankMap[e.uniqueId];
  // 成績摘要（總成績、平均配速）與證書資料共用同一份計算
  const gDoc=gSnap.docs.find(d=>d.id===e.groupId);
  const gData=gDoc?gDoc.data():{};
  const info=certComputeInfo({ entry:e, groupName:gData.name||'', group:gData, stations, groupUids, recsByUid, ranks:rankMap, ev:certEventInfo, checkinIds });
  info.eventId=eventId;

  let html='<div class="card">'+evTitle
    +'<div class="runner-card-header">'
    +'<strong style="font-size:1.05rem">'+esc(e.name||'')+'</strong>'
    +'<span class="badge">'+esc(e.group||'-')+'</span>'
    +'<span class="badge">編號 '+esc(e.bibNumber||'-')+'</span>'
    +(info.timed&&finalRank?'<span class="badge badge-green">終點第 '+finalRank+' 名</span>':'')
    +'</div>';
  // 不計時組別：不打卡、沒有記錄，不列成績也不產生證書／獎狀
  if(!info.timed){html+='<p style="color:var(--muted);font-size:.85rem;margin-top:8px">不計時組別，沒有成績記錄</p></div>';return html;}
  if(info.completed){
    html+='<div style="margin:8px 0 4px;font-size:.88rem">總成績 <strong style="font-family:var(--mono);color:var(--green)">'+esc(info.finishTime)+'</strong>'
      +(info.pace?'<span style="color:var(--muted)"> ・ </span>平均配速 <strong style="font-family:var(--mono)">'+esc(info.pace)+'</strong>':'')+'</div>';
  }
  if(!allRecs.length){html+='<p style="color:var(--muted);font-size:.85rem;margin-top:8px">尚無打卡記錄</p></div>';return html;}
  html+='<div class="table-wrap"><table><thead><tr>'
    +'<th>站點</th><th>到達時間</th><th>區段時間</th><th>累積時間</th><th>名次</th>'
    +'</tr></thead><tbody>';
  // 起點一律用第一站的記錄（跟名次同一套規則）；沒有第一站記錄就不顯示累積時間
  const firstRec=stations[0]?allRecs.find(x=>x.stationId===stations[0].id):null;
  let prevRec=null;
  stations.forEach((s,i)=>{
    const rec=allRecs.find(x=>x.stationId===s.id);
    const arrived=!!rec;
    const total=arrived&&i>0&&firstRec?diffHMS(rec.scanTime,firstRec.scanTime):null;
    // 第二站（i===1）區段時間 = 累積時間，省略不顯示；第三站以後才顯示區段時間
    const seg=arrived&&i>1&&prevRec?diffHMS(rec.scanTime,prevRec.scanTime):null;
    const sRank=arrived&&i>0?rankMap[e.uniqueId+'_'+s.id]:null;
    if(arrived) prevRec=rec;
    html+='<tr><td>'+(i===0?'<span style="color:var(--muted);font-size:.7rem">(起跑)</span> ':'')+esc(s.name)+'</td>'
      +(arrived
        ?'<td>'+fmt(rec.scanTime)+'</td>'
          +'<td>'+(seg||(i===1?'（同累積）':'-'))+'</td>'
          +'<td>'+(total||'-')+'</td>'
          +'<td>'+(sRank?'第'+sRank+'名':'-')+'</td>'
        :'<td style="color:var(--muted)">未到</td><td style="color:var(--muted)">-</td><td style="color:var(--muted)">-</td><td style="color:var(--muted)">-</td>')
      +'</tr>';
  });
  html+='</tbody></table></div>';

  // ── 完賽證書／獎狀：依後台各自的「頒發條件」判斷（共同條件：全部站點都有打卡、沒超過完賽時間限制）──
  if(info.completed){
    const sets=await certSettingsP;
    let out='', overLimit=false;
    ['certificate','award'].forEach((kind,k)=>{
      const K=CERT_KINDS[kind], set=sets[k];
      const el=certEligible(info, set.rules[e.groupId]||K.rule, finishTimeLimit);
      if(el.overLimit){ overLimit=true; return; }
      if(!el.ok) return;
      if(!set.open){
        out+='<div style="margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:.82rem;color:var(--muted);text-align:center">⏳ 成績確認中，'+K.label+'將於主辦單位確認成績後開放下載</div>';
        return;
      }
      const idx=certDataStore.push({...info, kind, awardNames:set.awardNames})-1;
      out+='<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="openCertificate('+idx+')">'+K.icon+' 產生'+K.label+'</button>';
    });

function certFontCssUrl(family) {
  const f = CERT_FONTS_ZH.concat(CERT_FONTS_EN).find((x) => x.id === family);
  const name = encodeURIComponent(family).replace(/%20/g, '+');
  const w = f && f.weights.length > 1 ? ':wght@' + f.weights.join(';') : '';
  return 'https://fonts.googleapis.com/css2?family=' + name + w + '&display=swap';
}
const _certFontCss = {};
function certEnsureFontCss(family) {
  if (!family) return Promise.resolve();
  if (_certFontCss[family]) return _certFontCss[family];
  _certFontCss[family] = new Promise((resolve) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = (window.CERT_FONT_CSS_OVERRIDE ? window.CERT_FONT_CSS_OVERRIDE(family) : certFontCssUrl(family));
    link.onload = () => resolve();
    link.onerror = () => resolve(); // 載入失敗就用備用字型畫，不要整張證書卡住
    document.head.appendChild(link);
  });
  return _certFontCss[family];
}
function certFontString(b, px) {
  const fams = [];
  if (b.fontEn) fams.push('"' + b.fontEn + '"');
  fams.push('"' + (b.fontZh || 'Noto Sans TC') + '"');
  fams.push('sans-serif');
  return (b.weight || 400) + ' ' + px + 'px ' + fams.join(', ');
}
// 確保每個文字方塊「實際要畫的字」都已下載好；字型沒好就畫，會變成手機預設字型而且每次結果不一樣
async function certEnsureFonts(tpl, data) {
  const boxes = (tpl && tpl.boxes) || [];
  const fams = new Set();
  boxes.forEach((b) => { if (b.fontZh) fams.add(b.fontZh); if (b.fontEn) fams.add(b.fontEn); });
  await Promise.all([...fams].map(certEnsureFontCss));
  if (!document.fonts || !document.fonts.load) return;
  const jobs = boxes.map((b) => {
    const r = certResolveText(b, data);
    if (r.hidden || !r.text.trim()) return null;
    return document.fonts.load(certFontString(b, 40), r.text.replace(/\n/g, '')).catch(() => {});
  }).filter(Boolean);
  await Promise.race([Promise.all(jobs), new Promise((r) => setTimeout(r, 10000))]); // 最多等 10 秒
}

// ── 變數代入 ──
// 回傳 {text, hidden}。hide：'' 不隱藏；'*' 內容中任一變數沒有值就隱藏；'變數名' 該變數沒有值就隱藏
function certResolveText(b, data) {
  data = data || {};
  let anyEmpty = false;
  const text = String(b.text || '').replace(/\{([^{}]+)\}/g, (m, k) => {
    if (!CERT_VARS.some((v) => v.key === k)) return m; // 不認得的代碼原樣保留，方便發現打錯字
    const v = data[k];
    if (v === undefined || v === null || String(v) === '') { anyEmpty = true; return ''; }
    return String(v);
  });
  let hidden = false;
  if (b.hide === '*') hidden = anyEmpty;
  else if (b.hide) { const v = data[b.hide]; hidden = v === undefined || v === null || String(v) === ''; }
  return { text, hidden };
}

// ── 換行：中文逐字可斷，英數字整個單字一起換行 ──
// 避頭點：這些標點不能出現在行首，換行時把前一個字一起帶到下一行（中文排版慣例）
const CERT_NO_LINE_START = '，。、；：！？）」』】》〉…—．,.;:!?)]}%';
function certWrapLine(ctx, line, maxW) {
  const tokens = line.match(/[A-Za-z0-9@#$%&*+\-_.,:;!?'"()\/]+|\s+|./gu) || [];
  const out = []; let cur = '';
  for (const t of tokens) {
    const test = cur + t;
    if (cur && ctx.measureText(test).width > maxW) {
      if (CERT_NO_LINE_START.includes(t[0]) && [...cur].length > 1) {
        const chars = [...cur]; const last = chars.pop();
        out.push(chars.join('').replace(/\s+$/, ''));
        cur = last + t;
        continue;
      }
      out.push(cur.replace(/\s+$/, ''));
      cur = /^\s+$/.test(t) ? '' : t;
    } else cur = test;
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}

      if(!blob){ showToast('圖片產生失敗，請改用列印功能','error'); return; }
      blob=await certPngWithDpi(blob,+cv.dataset.dpi||0);
      const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      // 手機（含 LINE、FB 內建瀏覽器）下載常沒反應，改跳出預覽讓使用者長按存圖
      if(isMobile){ showPngPreview(URL.createObjectURL(blob),blob,filename); return; }
      downloadBlob(blob,filename); showToast('已下載');
    },'image/png');
  }catch(e){ ok=false; }
  if(!ok) showToast('無法存成圖片（底圖主機不允許），請改用列印功能或截圖','error');
}
